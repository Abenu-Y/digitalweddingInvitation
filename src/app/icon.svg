<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Royal Emerald Gradient Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2e21" />
      <stop offset="70%" stop-color="#061f16" />
      <stop offset="100%" stop-color="#03120c" />
    </radialGradient>
    
    <!-- Luxurious Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#aa8214" />
      <stop offset="85%" stop-color="#edd58a" />
      <stop offset="100%" stop-color="#997514" />
    </linearGradient>

    <!-- Ring Shimmer Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff8db" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>

    <!-- Filter for soft gold glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.75" />

  <!-- Interlocking Wedding Rings (Groom & Bride Union) -->
  <!-- Left Ring -->
  <ellipse cx="27" cy="38" rx="8" ry="7" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" filter="url(#goldGlow)" />
  <!-- Right Ring (Interlocking) -->
  <ellipse cx="37" cy="38" rx="8" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#goldGlow)" />

  <!-- Royal Crown on top -->
  <path d="M21 24 L24 16 L32 21 L40 16 L43 24 Z" fill="url(#goldGrad)" stroke="#fff" stroke-width="0.5" filter="url(#goldGlow)" />
  
  <!-- Crown Jewels / Diamond Sparkles -->
  <circle cx="24" cy="15.5" r="1.5" fill="#ffffff" />
  <circle cx="32" cy="20.5" r="1.6" fill="#fff7d6" />
  <circle cx="40" cy="15.5" r="1.5" fill="#ffffff" />

  <!-- Top Center Celestial Sparkle -->
  <path d="M32 6 L33.2 10 L37 11.2 L33.2 12.4 L32 16 L30.8 12.4 L27 11.2 L30.8 10 Z" fill="url(#goldGrad)" />
</svg>
